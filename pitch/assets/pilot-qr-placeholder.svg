  <rect x="14" y="14" width="272" height="272" rx="14" fill="none" stroke="#A78BFA" stroke-width="3" stroke-dasharray="12 10"/>
  <g fill="#EFE9DD">
    <rect x="40" y="40" width="30" height="30" rx="8"/>
    <rect x="230" y="40" width="30" height="30" rx="8"/>
    <rect x="40" y="230" width="30" height="30" rx="8"/>
    <rect x="230" y="230" width="30" height="30" rx="8"/>
  </g>
  <text x="150" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="84" font-weight="900" letter-spacing="-4" fill="#25162B">QR</text>
