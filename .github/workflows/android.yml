# Android CI for the native Focus Mode+ app (android/). The PWA is not built or changed here.
# No signing secrets, no Play upload: this produces a debug APK artifact only.
name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 build-tools;36.0.0 platform-tools"

      - name: Unit, Room, Robolectric and Compose tests
        run: ./gradlew --no-configuration-cache testDebugUnitTest :core:domain:test :core:model:test

      - name: Android Lint (app checks all module dependencies)
        run: ./gradlew --no-configuration-cache :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-configuration-cache :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-mode-plus-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/screenshots/
          retention-days: 14
