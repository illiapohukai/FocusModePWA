# Focus Mode+ Android — single source of dependency versions.
# Every version below was resolved from the official repositories (dl.google.com Google Maven,
# Maven Central, Gradle Plugin Portal) on 2026-11-19. See android/README.md "Selected versions".

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"

compileSdk = "37"
compileSdkMinor = "2"
targetSdk = "37"
minSdk = "26"

composeBom = "2026.11.01"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.1"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
hilt = "2.60.1"
androidxHilt = "1.4.0"
coroutines = "1.11.0"
serialization = "1.13.0"
retrofit = "3.0.0"
okhttp = "5.5.1"
# v21 account & sync (resolved from Google Maven on 2026-11-26). Firebase libraries are versioned only by the BoM.
firebaseBom = "35.2.0"
credentials = "1.6.0"
googleid = "1.2.1"
googleServices = "4.6.0"

junit = "4.13.2"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
turbine = "1.2.1"

